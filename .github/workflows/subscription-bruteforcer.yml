name: V2Ray Subscription Brute Forcer

on:
  schedule:
    - cron: '0 */7 * * *'

  # Manual trigger with inputs
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose brute-force mode"
        required: true
        default: "test"
        type: choice
        options:
          - Test Mode
          - Random Mode
          - Sequential Mode

      full_url:
        description: "Full subcription URL for Test Mode"
        required: false
        default: ""
        type: string

      base_url:
        description: "Main Base URL"
        required: false
        type: string

      charcount:
        description: "Total suffix characters count to solve"
        required: false
        default: "32"
        type: string

      known_prefix:
        description: "Known prefix for Random/Sequential Mode"
        required: false
        default: ""
        type: string

      sequential_direction:
        description: "Which digit position should change fastest in Sequential Mode"
        required: true
        default: "Last digit first"
        type: choice
        options:
          - First digit first
          - Last digit first

      generated_position:
        description: "Where to place the generated characters"
        required: true
        default: "Back of known prefix"
        type: choice
        options:
          - Front of known prefix
          - Back of known prefix

      delay_ms:
        description: 'Delay between requests in milliseconds (0 = no delay)'
        required: true
        default: '500'

      stop_on_hit:
        description: "Stop when a valid result is found"
        required: true
        default: "true"
        type: choice
        options:
          - true
          - false

permissions:
  contents: write
  actions: write

jobs:
  Fetching:
    runs-on: windows-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # CHECKING INPUTS
      # ============================================================
      - name: Checking Inputs
        id: load_inputs
        shell: powershell
        env:
          GITHUB_EVENT_NAME_INPUT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FULL_URL: ${{ inputs.full_url }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
          INPUT_CHARCOUNT: ${{ inputs.charcount }}
          INPUT_KNOWN_PREFIX: ${{ inputs.known_prefix }}
          INPUT_SEQUENTIAL_DIRECTION: ${{ inputs.sequential_direction }}
          INPUT_GENERATED_POSITION: ${{ inputs.generated_position }}
          INPUT_DELAY_MS: ${{ inputs.delay_ms }}
          INPUT_STOP_ON_HIT: ${{ inputs.stop_on_hit }}
        run: .\.github\scripts\checking_inputs.ps1

      # ============================================================
      # TEST MODE
      # ============================================================
      - name: Test Mode
        if: ${{ steps.load_inputs.outputs.mode == 'Test Mode' }}
        shell: powershell
        env:
          INPUT_FULL_URL: ${{ steps.load_inputs.outputs.full_url }}
        run: .\.github\scripts\test_mode.ps1

      # ============================================================
      # SEQUENTIAL CHECKING
      # ============================================================
      - name: Sequential Checking
        if: ${{ steps.load_inputs.outputs.mode == 'Sequential Mode' }}
        shell: powershell
        env:
          INPUT_CHARCOUNT: ${{ steps.load_inputs.outputs.charcount }}
          INPUT_KNOWN_PREFIX: ${{ steps.load_inputs.outputs.known_prefix }}
        run: .\.github\scripts\sequential_checking.ps1

      # ============================================================
      # COMPARE INPUTS AND LAST CHECKPOINT
      # ============================================================
      - name: Compare Inputs And Last Runner States
        if: ${{ steps.load_inputs.outputs.mode == 'Sequential Mode' }}
        shell: powershell
        env:
          INPUT_BASE_URL: ${{ steps.load_inputs.outputs.base_url }}
          INPUT_KNOWN_PREFIX: ${{ steps.load_inputs.outputs.known_prefix }}
          INPUT_CHARCOUNT: ${{ steps.load_inputs.outputs.charcount }}
        run: .\.github\scripts\compare_checkpoint.ps1

      # ============================================================
      # SAVE ALL CURRENT INPUTS
      # ============================================================
      - name: Save Current Inputs To State
        if: ${{ steps.load_inputs.outputs.mode == 'Sequential Mode' }}
        shell: powershell
        env:
          INPUT_MODE: ${{ steps.load_inputs.outputs.mode }}
          INPUT_FULL_URL: ${{ steps.load_inputs.outputs.full_url }}
          INPUT_BASE_URL: ${{ steps.load_inputs.outputs.base_url }}
          INPUT_CHARCOUNT: ${{ steps.load_inputs.outputs.charcount }}
          INPUT_KNOWN_PREFIX: ${{ steps.load_inputs.outputs.known_prefix }}
          INPUT_SEQUENTIAL_DIRECTION: ${{ steps.load_inputs.outputs.sequential_direction }}
          INPUT_GENERATED_POSITION: ${{ steps.load_inputs.outputs.generated_position }}
          INPUT_DELAY_MS: ${{ steps.load_inputs.outputs.delay_ms }}
          INPUT_STOP_ON_HIT: ${{ steps.load_inputs.outputs.stop_on_hit }}
        run: .\.github\scripts\save_state.ps1

      # ============================================================
      # SEQUENTIAL GENERATING
      # ============================================================
      - name: Sequential Generating
        if: ${{ steps.load_inputs.outputs.mode == 'Sequential Mode' }}
        shell: powershell
        env:
          INPUT_MODE: ${{ steps.load_inputs.outputs.mode }}
          INPUT_FULL_URL: ${{ steps.load_inputs.outputs.full_url }}
          INPUT_BASE_URL: ${{ steps.load_inputs.outputs.base_url }}
          INPUT_CHARCOUNT: ${{ steps.load_inputs.outputs.charcount }}
          INPUT_KNOWN_PREFIX: ${{ steps.load_inputs.outputs.known_prefix }}
          INPUT_SEQUENTIAL_DIRECTION: ${{ steps.load_inputs.outputs.sequential_direction }}
          INPUT_GENERATED_POSITION: ${{ steps.load_inputs.outputs.generated_position }}
          INPUT_DELAY_MS: ${{ steps.load_inputs.outputs.delay_ms }}
          INPUT_STOP_ON_HIT: ${{ steps.load_inputs.outputs.stop_on_hit }}
          INPUT_WORKFLOW_NAME: ${{ github.workflow }}
        run: .\.github\scripts\sequential_generating.ps1

      # ============================================================
      # UPDATE RESULTS AND LAST CHECKPOINT
      # ============================================================
      - name: Update Results And Last Checkpoint
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add found_subs.txt last_runner_states.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update brute forcer state"

            echo "[INFO] Syncing with remote main before push..."

            git fetch origin main
            git rebase origin/main

            echo "[INFO] Pushing latest results and checkpoint..."

            git push origin HEAD:main
          else
            echo "[INFO] No changes to commit."
          fi
